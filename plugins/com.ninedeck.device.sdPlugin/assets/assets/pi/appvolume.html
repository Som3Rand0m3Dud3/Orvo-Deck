<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; background: #12151b; }
body { padding: 12px; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; color: #d4d8e0; }
label { display: block; margin-bottom: 6px; color: #8a91a0; }
.row { display: flex; gap: 6px; }
select, input, button { height: 34px; border-radius: 8px; border: 1px solid #2e3440; background: #1a1f28; color: #e6e8ee; font: inherit; }
select { flex: 1; padding: 0 8px; }
input { width: 100%; box-sizing: border-box; padding: 0 10px; margin-top: 8px; }
button { padding: 0 10px; cursor: pointer; }
button:hover { background: #232a35; }
p { margin: 8px 0 0; color: #8a91a0; line-height: 1.4; }
</style>
</head>
<body>
<label for="pick">App to control</label>
<div class="row">
	<select id="pick"><option value="">Looking for apps playing sound…</option></select>
	<button id="refresh" title="Refresh the list">↻</button>
</div>
<input id="app" placeholder="…or type a program name, e.g. discord" autocomplete="off">
<p>The list shows apps that have sound open right now. Start the app (and play something) if it's missing, then press ↻.</p>
<script>
let ws, uuid, actionUUID, settings = {};
const pick = document.getElementById("pick"), input = document.getElementById("app");
function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
	uuid = inUUID;
	try { const a = JSON.parse(actionInfo); actionUUID = a.action; settings = a.payload.settings || {}; } catch (e) {}
	input.value = settings.app || "";
	ws = new WebSocket("ws://127.0.0.1:" + port);
	ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
	ws.onmessage = (m) => {
		let msg; try { msg = JSON.parse(m.data); } catch (e) { return; }
		if (msg.event === "sendToPropertyInspector" && msg.payload && msg.payload.apps) fill(msg.payload.apps);
	};
}
function fill(apps) {
	const cur = (settings.app || "").toLowerCase();
	if (cur && !apps.includes(cur)) apps = [cur, ...apps];
	pick.innerHTML = "";
	const none = document.createElement("option");
	none.value = ""; none.textContent = apps.length ? "Choose an app…" : "No apps playing sound";
	pick.appendChild(none);
	for (const a of apps) {
		const o = document.createElement("option");
		o.value = a; o.textContent = a;
		pick.appendChild(o);
	}
	pick.value = cur;
}
function save(app) {
	settings.app = app.trim().toLowerCase().replace(/\.exe$/, "");
	input.value = settings.app;
	if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
}
pick.addEventListener("change", () => { if (pick.value) save(pick.value); });
input.addEventListener("change", () => save(input.value));
input.addEventListener("keyup", (e) => { if (e.key === "Enter") save(input.value); });
document.getElementById("refresh").addEventListener("click", () => {
	if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: "sendToPlugin", action: actionUUID, context: uuid, payload: { refreshApps: true } }));
});
</script>
</body>
</html>
