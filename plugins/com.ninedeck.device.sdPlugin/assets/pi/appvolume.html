<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; padding: 12px; font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; color: #d4d8e0; background: transparent; }
label { display: block; margin-bottom: 6px; color: #8a91a0; }
input { width: 100%; box-sizing: border-box; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid #2e3440; background: #151920; color: #e6e8ee; font: inherit; }
p { margin: 8px 0 0; color: #8a91a0; line-height: 1.4; }
</style>
</head>
<body>
<label for="app">App to control</label>
<input id="app" list="apps" placeholder="e.g. discord" autocomplete="off">
<datalist id="apps"><option value="discord"><option value="chrome"><option value="msedge"><option value="firefox"><option value="spotify"><option value="obs64"><option value="steam"></datalist>
<p>Type the app's program name (the part before .exe in Task Manager). The slider sets that app's volume in the Windows volume mixer.</p>
<script>
let ws, uuid, settings = {};
const input = document.getElementById("app");
function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
	uuid = inUUID;
	try { settings = JSON.parse(actionInfo).payload.settings || {}; } catch (e) {}
	input.value = settings.app || "";
	ws = new WebSocket("ws://127.0.0.1:" + port);
	ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
}
function save() {
	settings.app = input.value.trim();
	if (ws && ws.readyState === 1) ws.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
}
input.addEventListener("change", save);
input.addEventListener("keyup", (e) => { if (e.key === "Enter") save(); });
</script>
</body>
</html>
