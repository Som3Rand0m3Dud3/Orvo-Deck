name: ai-probe
on:
  push:
    branches: [ai-probe]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: deps
        run: |
          pip install --quiet onnxruntime==1.24.4 numpy soundfile scipy onnx
          pip install --quiet torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get install -y -qq espeak-ng > /dev/null
      - uses: actions/cache@v4
        with: { path: m, key: ai-models-v1 }
      - name: models
        run: |
          mkdir -p m && cd m
          get() { [ -s "$1" ] && [ $(stat -c%s "$1") -gt 1000000 ] || curl -fsSL --retry 5 --retry-delay 5 -o "$1" "$2"; }
          get contentvec.onnx https://huggingface.co/TigreGotico/voiceclonnx-rvc/resolve/main/contentvec_768l12.onnx
          get rmvpe.onnx https://huggingface.co/Scicom-intl/rmvpe-onnx/resolve/main/rmvpe.onnx
          get voice.pth https://huggingface.co/licyk/rvc-model/resolve/main/voices/zhanzhanv2-xi/zhanzhanv2-xi.pth
          curl -sSL -o pitch_onnx.py https://huggingface.co/Scicom-intl/rmvpe-onnx/resolve/main/pitch_onnx.py || true
          ls -la
          git clone -q --depth 1 --branch 2.2.231006 https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI ../rvc; sed -i "s/                x = flow(x, x_mask, g=g, reverse=reverse)/                x, _ = flow(x, x_mask, g=g, reverse=reverse)/" ../rvc/infer/lib/infer_pack/models_onnx.py; grep -c "x, _ = flow" ../rvc/infer/lib/infer_pack/models_onnx.py
      - name: probe
        run: python .github/ai-probe.py 2>&1 | grep -v Warning
      - name: rust engine on real models (CPU)
        run: |
          python .github/ai-check.py make
          ORT=$(python -c "import onnxruntime,os,glob;print(glob.glob(os.path.join(os.path.dirname(onnxruntime.__file__),'capi','libonnxruntime.so*'))[0])")
          echo "ort lib: $ORT"
          cd .github/aitest && cargo build --release -q && cd ../..
          ORVO_ORT_LIB=$ORT .github/aitest/target/release/aitest m m/voice.onnx out/in48.f32 out/rust48.f32
          python .github/ai-check.py check out/rust48.f32
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: "out/*" }
      - uses: actions/upload-artifact@v4
        with: { name: voice, path: "m/voice.onnx" }
  windows-dml:
    needs: probe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: voice, path: m }
      - uses: actions/download-artifact@v4
        with: { name: probe, path: out }
      - name: engine files (like Orvo's installer)
        shell: bash
        run: |
          cd m
          curl -fsSL -o ort.nupkg https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.directml/1.24.4/microsoft.ml.onnxruntime.directml.1.24.4.nupkg
          curl -fsSL -o dml.nupkg https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/1.15.4/microsoft.ai.directml.1.15.4.nupkg
          unzip -j -o -q ort.nupkg runtimes/win-x64/native/onnxruntime.dll runtimes/win-x64/native/onnxruntime_providers_shared.dll
          unzip -j -o -q dml.nupkg bin/x64-win/DirectML.dll
          curl -fsSL -o contentvec.onnx https://huggingface.co/TigreGotico/voiceclonnx-rvc/resolve/main/contentvec_768l12.onnx
          curl -fsSL -o rmvpe.onnx https://huggingface.co/Scicom-intl/rmvpe-onnx/resolve/main/rmvpe.onnx
          ls -la
      - name: rust engine with DirectML
        shell: bash
        run: |
          cd .github/aitest && cargo build --release -q && cd ../..
          .github/aitest/target/release/aitest.exe m m/voice.onnx out/in48.f32 out/win48.f32 gpu
          pip install --quiet onnxruntime numpy soundfile scipy
          python .github/ai-check.py check out/win48.f32
