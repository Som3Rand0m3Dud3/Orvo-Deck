name: "windows-build"

# Windows build of Orvo Studio.
# - Every push to main: test build, installer in the run's "Artifacts" section.
#   It is also published as a GitHub *pre-release* "v<version>" (marked as a test build),
#   so Orvo Studio's update button can install it when "Show test versions" is on.
#   Bump the version in src-tauri/Cargo.toml for each test build.
# - Pushing a tag like v1.0.0: publishes a normal (non-test) GitHub Release.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DENO_DIR: deno_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: setup Go (for the NineDeck device plugin)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          key: ${{ hashFiles('deno.lock') }}

      - name: install frontend dependencies
        run: deno install

      - name: build Orvo Studio
        run: deno task tauri build

      - name: upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OrvoStudio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: read app version
        shell: pwsh
        run: |
          $v = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: publish test version (pre-release)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Orvo Studio v${{ env.APP_VERSION }} (test)
          prerelease: true
          body: Test build of Orvo Studio. Not an official release.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Orvo Studio ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
