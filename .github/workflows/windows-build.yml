name: "windows-build"

# Test build of Orvo Studio for Windows on every push to main.
# Download the installer from the run's "Artifacts" section.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      DENO_DIR: deno_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: setup Go (for the NineDeck device plugin)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          key: ${{ hashFiles('deno.lock') }}

      - name: install frontend dependencies
        run: deno install

      - name: build Orvo Studio
        run: deno task tauri build

      - name: upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OrvoStudio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
