name: ai-hashes
on:
  push:
    branches: [ai-probe]
    paths: [".github/workflows/ai-hashes.yml"]
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d && cd d
          U=https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/1.15.4/microsoft.ai.directml.1.15.4.nupkg
          curl -sSIL $U | grep -iE "^HTTP|accept-ranges|content-length|^location"
          curl -sSL -r 0-99 $U | wc -c
          curl -fsSL -o dml.nupkg $U
          curl -fsSL -o ort.nupkg https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.directml/1.24.4/microsoft.ml.onnxruntime.directml.1.24.4.nupkg
          unzip -l dml.nupkg | grep "x64-win"
          unzip -v dml.nupkg | grep "x64-win/DirectML.dll"
          unzip -v ort.nupkg | grep "win-x64"
          unzip -o -q dml.nupkg bin/x64-win/DirectML.dll; sha256sum bin/x64-win/DirectML.dll
          unzip -o -q ort.nupkg runtimes/win-x64/native/onnxruntime.dll runtimes/win-x64/native/onnxruntime_providers_shared.dll; sha256sum runtimes/win-x64/native/*
